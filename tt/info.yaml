# Tiny Tapeout project information
project:
  title:        "DDS signal generator with SSB/AM/FM for a 14-bit parallel DAC"
  author:       "Ivan Gubochkin"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Modbus-controlled 32-bit DDS (interpolated sine, triangle, sawtooth, square, SSB, AM, FM of host-streamed audio) driving an AD9767-class 14-bit DAC at the chip clock"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # 32 tiles: non-standard, enabled on request by the TT team (SSB=1 build, ~49 % utilisation)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_gubochkin_dds"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "sine_interp.v"
    - "serial_mul.v"
    - "baseband_dsp.v"
    - "cic_interp.v"
    - "uart.v"
    - "modbus_rtu_slave.v"
    - "dac_regs.v"
    - "dds_channel.v"
    - "tt_um_gubochkin_dds.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "UART RX (Modbus RTU, 1 Mbaud 8-E-1)"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "DAC D6"
  uo[1]: "DAC D7"
  uo[2]: "DAC D8"
  uo[3]: "DAC D9"
  uo[4]: "DAC D10"
  uo[5]: "DAC D11"
  uo[6]: "DAC D12"
  uo[7]: "DAC D13"

  # Bidirectional pins
  uio[0]: "DAC D0"
  uio[1]: "DAC D1"
  uio[2]: "DAC D2"
  uio[3]: "DAC D3"
  uio[4]: "DAC D4"
  uio[5]: "DAC D5"
  uio[6]: "DAC CLK (= clk)"
  uio[7]: "UART TX"

# Do not change!
yaml_version: 6
